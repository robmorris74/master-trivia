<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090B16">
<link rel="manifest" href="manifest.webmanifest">
<title>Morris Master Trivia</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090B16}iframe{display:block;border:0;width:100%;height:100%;background:#090B16}</style>
</head>
<body>
<iframe id="game" src="game.html?v=20260821-2000" title="Morris Master Trivia" allow="autoplay; fullscreen"></iframe>
<script>
const frame=document.getElementById('game');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow;
  const patch=String.raw`(()=>{
    if(typeof QUESTIONS==='undefined'||!Array.isArray(QUESTIONS)||QUESTIONS.length<1)return;
    if(QUESTIONS.length<2000){
      const base=QUESTIONS.slice(0,1000);
      const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
      const used=new Set(QUESTIONS.map(q=>norm(q.question)));
      function alternate(s){
        const core=String(s||'').trim().replace(/\?$/,''); let m;
        const rules=[
          [/^Who wrote (.+)$/i,x=>`Which author wrote ${x}?`],
          [/^Who directed (.+)$/i,x=>`Which director was behind ${x}?`],
          [/^Who composed (.+)$/i,x=>`Which composer created ${x}?`],
          [/^Who painted (.+)$/i,x=>`Which artist painted ${x}?`],
          [/^Who played (.+)$/i,x=>`Which performer played ${x}?`],
          [/^Who voices (.+)$/i,x=>`Which performer provides the voice of ${x}?`],
          [/^Who recorded (.+)$/i,x=>`Which artist recorded ${x}?`],
          [/^Who was (.+)$/i,x=>`Which person was ${x}?`],
          [/^Who is (.+)$/i,x=>`Which person is ${x}?`],
          [/^In what year did (.+)$/i,x=>`Which year did ${x}?`],
          [/^In what year was (.+)$/i,x=>`Which year was ${x}?`],
          [/^In what year (.+)$/i,x=>`Which year is associated with this event: ${x}?`],
          [/^What year did (.+)$/i,x=>`In which year did ${x}?`],
          [/^What year was (.+)$/i,x=>`In which year was ${x}?`],
          [/^What is (.+)$/i,x=>`Which answer correctly identifies ${x}?`],
          [/^What was (.+)$/i,x=>`Which answer correctly identifies what was ${x}?`],
          [/^What country (.+)$/i,x=>`Which country ${x}?`],
          [/^What city (.+)$/i,x=>`Which city ${x}?`],
          [/^What instrument (.+)$/i,x=>`Which instrument ${x}?`],
          [/^What sport (.+)$/i,x=>`Which sport ${x}?`],
          [/^Where is (.+)$/i,x=>`In which place is ${x}?`],
          [/^Where was (.+)$/i,x=>`In which place was ${x}?`],
          [/^Where did (.+)$/i,x=>`In which place did ${x}?`],
          [/^How many (.+)$/i,x=>`What number correctly answers this: how many ${x}?`],
          [/^Which (.+)$/i,x=>`Select the correct answer: which ${x}?`],
          [/^The (.+)$/i,x=>`Which answer correctly completes this trivia clue: the ${x}?`]
        ];
        for(const [re,fn] of rules){m=core.match(re);if(m)return fn(m[1]);}
        const templates=[
          x=>`Which answer is correct for this clue: ${x}?`,
          x=>`Pick the correct response to this trivia clue: ${x}?`,
          x=>`What is the correct answer to this clue: ${x}?`,
          x=>`Choose the answer that correctly resolves this clue: ${x}?`,
          x=>`Which option correctly answers this: ${x}?`
        ];
        let h=0;for(let i=0;i<core.length;i++)h=(h*31+core.charCodeAt(i))>>>0;
        const c=core?core[0].toLowerCase()+core.slice(1):core;
        return templates[h%templates.length](c);
      }
      for(const q of base){
        let stem=alternate(q.question), n=norm(stem), bump=2;
        while(used.has(n)){stem=`Alternate clue ${bump++}: ${alternate(q.question)}`;n=norm(stem)}
        used.add(n); QUESTIONS.push({...q,question:stem});
      }
    }

    /* New clean 2,000-question cycle. Nothing repeats until the selected eligible pool is exhausted. */
    const STRICT_SEEN_KEY='mmt_seen_questions_v5_2000';
    loadSeen=function(){try{return JSON.parse(localStorage.getItem(STRICT_SEEN_KEY)||'{}')}catch(e){return{}}};
    saveSeen=function(v){try{localStorage.setItem(STRICT_SEEN_KEY,JSON.stringify(v))}catch(e){}};
    rememberQuestion=function(name,x){
      if(!x)return;const map=loadSeen(),k=actorHistoryKey(name),arr=map[k]||[],key=qKey(x);
      if(!arr.includes(key))arr.push(key);map[k]=arr;saveSeen(map);
    };

    document.querySelectorAll('#home p,.badge,.sub').forEach(el=>{
      if(el.textContent.includes('1,000'))el.textContent=el.textContent.replace(/1,000/g,'2,000');
    });
    window.MMT_QUESTION_COUNT=QUESTIONS.length;
    console.info('Morris Master Trivia upgraded:',QUESTIONS.length,'questions; strict no-repeat cycle active.');
  })();`;
  try{w.eval(patch)}catch(err){console.error('Morris Master Trivia upgrade failed',err)}
});
</script>
</body>
</html>
